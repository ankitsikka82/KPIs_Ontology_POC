        <center>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 400px;
                 background-color: #ffffff;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#74b9ff", "id": "Shipment", "label": "Shipment", "shape": "dot", "size": 25, "title": "A freight shipment with origin, destination, weight, and volume"}, {"color": "#ff9f43", "id": "Trailer", "label": "Trailer", "shape": "dot", "size": 35, "title": "A physical trailer used in linehaul operations"}, {"color": "#ff9f43", "id": "Terminal", "label": "Terminal", "shape": "dot", "size": 35, "title": "A freight terminal or hub location"}, {"color": "#ff9f43", "id": "Dispatch", "label": "Dispatch", "shape": "dot", "size": 35, "title": "A linehaul movement of one or more trailers with one driver from origin to destination"}, {"color": "#ff9f43", "id": "CubeUtilization", "label": "CubeUtilization", "shape": "dot", "size": 35, "title": "Calculated metric showing how efficiently a trailer is filled"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#b2bec3", "font": {"size": 9}, "from": "Shipment", "label": "Shipment loaded in Trailer", "title": "A shipment is physically loaded into a trailer", "to": "Trailer"}, {"arrows": "to", "color": "#b2bec3", "font": {"size": 9}, "from": "Trailer", "label": "Trailer part of Dispatch", "title": "A trailer is assigned to a linehaul dispatch", "to": "Dispatch"}, {"arrows": "to", "color": "#b2bec3", "font": {"size": 9}, "from": "Dispatch", "label": "Dispatch originates from Terminal", "title": "A dispatch starts from an origin terminal", "to": "Terminal"}, {"arrows": "to", "color": "#b2bec3", "font": {"size": 9}, "from": "Dispatch", "label": "Dispatch arrives at Terminal", "title": "A dispatch ends at a destination terminal", "to": "Terminal"}, {"arrows": "to", "color": "#b2bec3", "font": {"size": 9}, "from": "Shipment", "label": "Shipment routes through Terminals", "title": "A shipment travels through a planned sequence of terminals (legs)", "to": "Terminal"}, {"arrows": "to", "color": "#b2bec3", "font": {"size": 9}, "from": "CubeUtilization", "label": "Utilization calculated for Trailer", "title": "Utilization metric is computed for a specific trailer", "to": "Trailer"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "barnesHut": {
            "avoidOverlap": 0,
            "centralGravity": 0.3,
            "damping": 0.09,
            "gravitationalConstant": -80000,
            "springConstant": 0.001,
            "springLength": 250
        },
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
